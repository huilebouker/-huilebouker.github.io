<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Huilerie Bouker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;background:#fdfcf6}
header{background:#2d4a22;color:#fff;padding:15px;text-align:center;position:sticky;top:0}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:12px}
.card{background:#fff;border-radius:10px;padding:10px;box-shadow:0 2px 6px #0001;text-align:center}
.card img{width:100%;height:120px;object-fit:cover;border-radius:8px}
.card button{background:#2d4a22;color:#fff;border:0;padding:7px 12px;border-radius:20px;width:100%;margin-top:6px;cursor:pointer}
.cart,.form{background:#fff;margin:12px;border-radius:12px;padding:14px;box-shadow:0 2px 6px #0001}
.cart-item{display:flex;justify-content:space-between;font-size:14px;margin:5px 0}
.total{font-weight:bold;border-top:1px solid #eee;margin-top:8px;padding-top:8px;display:flex;justify-content:space-between}
input{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
.pay label{display:flex;gap:8px;padding:10px;border:1px solid #ddd;border-radius:8px;margin:6px 0}
.pay label:has(input:checked){border-color:#2d4a22;background:#f0f7ed}
#locBtn{background:#25D366;color:#fff;border:0;padding:10px;border-radius:8px;width:100%;margin:6px 0;cursor:pointer;font-weight:700}
#orderBtn{background:#2d4a22;color:#fff;border:0;padding:14px;border-radius:10px;width:100%;font-size:16px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<header><h1>🌿 Huilerie Bouker</h1><div style="font-size:13px">Huile d'Olive Extra Vierge - El Djem</div></header>
<div class="products" id="products"></div>
<div class="cart"><h2>🛒 Panier</h2><div id="cartItems">Vide</div><div class="total"><span>Total</span><span id="cartTotal">0 DT</span></div><div id="deliveryInfo" style="font-size:12px;color:#666"></div></div>
<div class="form">
<h2>📦 Client</h2>
<input id="clientName" placeholder="Nom *">
<input id="clientTel" placeholder="Tel *">
<input id="clientAdr" placeholder="Adresse *">
<button id="locBtn" onclick="getLocation()">📍 Partager localisation GPS</button><small id="locStatus" style="display:block;text-align:center"></small>
<div class="pay">
<label><input type="radio" name="pay" value="livraison" checked> 🚚 A la livraison</label>
<label><input type="radio" name="pay" value="carte"> 💳 Carte (Visa/Master/e-Dinar/Flouci)</label>
</div>
<button id="orderBtn" onclick="orderWhatsApp()">Commander</button>
</div>
<script>
const PRODUCTS=[{id:1,name:"Huile 1L",price:28,img:"https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=400"},{id:2,name:"Huile 3L",price:75,img:"https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=400"},{id:3,name:"Huile 5L",price:120,img:"https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=400"}];
let cart=[];let clientLocation="";
function renderProducts(){let h="";PRODUCTS.forEach(p=>{h+=`<div class=card><img src=${p.img}><h3>${p.name}</h3><div style=color:#2d4a22;font-weight:bold>${p.price} DT</div><button onclick=addToCart(${p.id})>Ajouter</button></div>`});document.getElementById('products').innerHTML=h}
function addToCart(id){let pr=PRODUCTS.find(x=>x.id==id);let ex=cart.find(x=>x.id==id);if(ex)ex.qty++;else cart.push({...pr,qty:1});renderCart()}
function renderCart(){if(cart.length==0){document.getElementById('cartItems').innerText='Vide';document.getElementById('cartTotal').innerText='0 DT';return}let sub=0,html="";cart.forEach((it,i)=>{sub+=it.price*it.qty;html+=`<div class=cart-item><span>${it.qty}x ${it.name}</span><span>${it.price*it.qty} DT <span style=color:red;cursor:pointer onclick="cart.splice(${i},1);renderCart()">✕</span></span></div>`});let del=sub>=400?0:8;document.getElementById('cartItems').innerHTML=html;document.getElementById('cartTotal').innerText=(sub+del)+' DT';document.getElementById('deliveryInfo').innerText=del==0?'Livraison gratuite 🎉':`Sous-total ${sub} DT + Livraison ${del} DT`}
function getLocation(){let s=document.getElementById('locStatus');let b=document.getElementById('locBtn');s.innerText='Recherche...';if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{clientLocation=`https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`;s.innerText='✅ Position ajoutée';b.innerText='✅ Position ajoutée';b.style.background='#128C7E'},()=>{s.innerText='Activez GPS';alert('Activez GPS')})}else s.innerText='GPS non supporté'}
async function orderWhatsApp(){if(cart.length==0){alert('Panier vide');return}let name=document.getElementById('clientName').value.trim();let tel=document.getElementById('clientTel').value.trim();let adr=document.getElementById('clientAdr').value.trim();if(!name||!tel){alert('Nom et Tel obligatoires');return}let sub=cart.reduce((s,i)=>s+i.price*i.qty,0);let del=sub>=400?0:8;let total=sub+del;let pay=document.querySelector('input[name=pay]:checked').value;let loc=clientLocation?`\nLocalisation: ${clientLocation}`:"";let detail=cart.map(i=>`${i.qty}x ${i.name} = ${i.price*i.qty} DT`).join('\n');if(pay==='livraison'){let msg=`Salam Bouker\n\n${detail}\n\nTOTAL: ${total} DT\nPaiement: Livraison\n\nNom: ${name}\nTel: ${tel}\nAdr: ${adr}${loc}`;window.open(`https://api.whatsapp.com/send?phone=21628693560&text=${encodeURIComponent(msg)}`,'_blank');return}
const PUBLIC_KEY="PUT_PUBLIC_KEY_HERE";const PRIVATE_KEY="PUT_PRIVATE_KEY_HERE";
if(PUBLIC_KEY.includes("PUT_")){alert("Token Flouci mazal - commande par WhatsApp");let msg=`Salam Bouker\n\n${detail}\nTOTAL: ${total} DT\nCarte demandée\n\nNom: ${name}\nTel: ${tel}\nAdr: ${adr}${loc}`;window.open(`https://api.whatsapp.com/send?phone=21628693560&text=${encodeURIComponent(msg)}`,'_blank');return}
try{document.getElementById('orderBtn').innerText='Redirection...';let res=await fetch("https://developers.flouci.com/api/v2/generate_payment",{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${PUBLIC_KEY}:${PRIVATE_KEY}`},body:JSON.stringify({amount:(total*1000).toString(),accept_card:true,success_link:location.origin+"/success.html",fail_link:location.origin+"/fail.html",developer_tracking_id:Date.now().toString()})});let data=await res.json();if(data.result&&data.result.link){location.href=data.result.link}else{alert("Erreur Flouci: "+JSON.stringify(data));document.getElementById('orderBtn').innerText='Commander'}}catch(e){alert(e.message);document.getElementById('orderBtn').innerText='Commander'}}
renderProducts();renderCart();
</script>
</body>
</html>
